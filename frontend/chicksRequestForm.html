<div class="form-container">
  <div class="card">
    <h2 class="form-title">Chick Request Form</h2>
    <form id="chickRequestForm">
      <div class="mb-3">
        <label class="form-label" for="farmerName">Farmer Name</label>
        <input id="farmerName" class="form-control" type="text" name="farmerName">
        <div id="farmerNameErr" class="showerr"></div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="farmerNIN">Farmer NIN Number</label>
        <input id="farmerNIN" class="form-control" type="text" name="farmerNIN">
        <div id="farmerNINErr" class="showerr"></div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="numChicks">Number of Chicks</label>
        <input id="numChicks" class="form-control" type="number" name="numChicks" min="100" max="500">
        <div id="numChicksErr" class="showerr"></div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="typeChicks">Type of Chicks</label>
        <select id="typeChicks" class="form-select" name="typeChicks">
          <option value="">Select type</option>
          <option value="Layers">Layers</option>
          <option value="Broilers">Broilers</option>
        </select>
        <div id="typeChicksErr" class="showerr"></div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="farmerType">Type of Farmer</label>
        <select id="farmerType" class="form-select" name="farmerType">
          <option value="">Select farmer type</option>
          <option value="Starter">Starter</option>
          <option value="Returning">Returning</option>
        </select>
        <div id="farmerTypeErr" class="showerr"></div>
      </div>
      <button class="btn btn-submit w-100" type="submit">Submit Request</button>
    </form>
  </div>
</div>
